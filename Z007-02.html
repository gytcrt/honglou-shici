<h1>不因俊俏难为友</h1>

<p class="ctx"><i>前文</i>”说着，自回荣府而来。要知端的，且听下回分解。正是：</p>
<details class="zhi"><summary>诗前脂批 3 条</summary><span class="one"><i class="chip">蒙府</i><i class="chip pos">侧批</i>放笔痛骂一回，富贵之家，每罹此祸。</span><span class="one"><i class="chip">蒙府</i><i class="chip pos">侧批</i>暗伏后来史湘云之问。</span><span class="one"><i class="chip">蒙府</i><i class="chip pos">侧批</i>熙凤能事。</span></details>
<div class="lines"><div class="vl"><p>不因俊俏难为友，正为风流始读<span class="nb">书<button type="button" class="zm" data-k="z0-0-15" aria-label="脂批">脂</button><span class="jz"><span class="one" data-k="z0-0-15"><i class="chip">甲戌</i><i class="chip pos">侧批</i>原来不读书即蠢物矣。</span></span>。</span></p></div></div>
