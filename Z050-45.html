<h1>赋得红梅花三首·其二</h1>



<div class="lines"><div class="vl"><p>凭诗祝舜尧。</p></div></div>
<p class="ctx after"><i>后文</i>李纨道：“够了，够了。虽没作完了韵，剩的字若生扭用了，倒不好了。”说着，大家来细细评论一回，独湘云的多，都笑道：“这都是那块鹿肉的功劳。” 李纨笑道：“逐句评去都还一气，只是宝玉又落了第了。”宝玉笑道：“我原不会联句，只好担待我罢。”</p>
