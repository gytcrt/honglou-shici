<h1>芦雪广即景联句·43/43</h1>



<div class="lines"><div class="vl"><p>不雨亦潇潇。</p></div></div>
<p class="ctx after"><i>后文</i>湘云伏着已笑软了。众人看他三人对抢，也都不顾作诗，看着也只是笑。黛玉还推他往下联，又道：“你也有才尽之时。我听听还有什么舌根嚼了！”湘云只伏在宝钗怀里，笑个不住。宝钗推他起来道：“你有本事，把‘二萧’的韵全用完了，我才伏你。”</p>
