<h1>只为同枝贪色欲</h1>

<p class="ctx"><i>前文</i>这里贾琏见诸事已妥，遂择了初三黄道吉日，娶二姐过门。未知如何，下回分解。正是：</p>

<div class="lines"><div class="vl"><p>只为同枝贪色欲，致教连理起戈矛。</p></div></div>
<p class="ctx after"><i>后文</i>歔。柔肠一段千般结，岂是寻常望雁鱼。</p>
<details class="zhi"><summary>诗后脂批 3 条</summary><span class="one"><i class="chip">戚序</i>总评：五首新诗何所居，颦儿应自日欷</span><span class="one"><i class="chip">批</i>五百年风流债，一见了偏作怪。你贪我爱自难休，天巧姻缘浑无奈。</span><span class="one"><i class="chip">批</i>父母者于子女间，莫失教训说前缘。防微之处休弛纵，严厉才能真爱怜。</span></details><div class="pn"><a href="Z064-10.html">‹ 上一首　五美吟·红拂</a><a href="Z064-c246.html">下一首　深闺有奇女 ›</a></div>
