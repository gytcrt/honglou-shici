<h1>访妙玉乞红梅·1/4</h1>

<p class="ctx"><i>前文</i>”宝玉笑道：“有了，你写吧。”众人听他念道：</p>

<div class="lines"><div class="vl"><p>酒未开樽句未<span class="nb">裁<button type="button" class="nm" data-k="n0-0" aria-label="注释①">①</button><span class="jz nz"><span class="one" data-k="n0-0">开樽：动杯，开始喝酒。樽，酒杯。句未裁：诗未作。裁，裁夺、构思推敲。</span></span>，</span></p></div></div>
<p class="ctx after"><i>后文</i>黛玉写了，摇头笑道：“起的平平。”湘云又道“快着！”</p>
