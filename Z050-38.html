<h1>芦雪广即景联句·38/43</h1>

<p class="ctx"><i>前文</i>黛玉忙笑道：</p>

<div class="lines"><div class="vl"><p>沁梅香可嚼<span class="nb">，<button type="button" class="nm" data-k="n0-0" aria-label="注释①">①</button><span class="jz nz"><span class="one" data-k="n0-0">“沁梅”二句：上句典出《花史》：宋时，“铁脚道人常爱赤脚走雪中，兴发则朗诵《南华·秋水篇》，嚼梅花满口，和雪咽之。曰：‘吾欲寒香沁入肺腑。’”下句意谓醉闻雪压竹之声，正好弹琴。用宋代王禹偁《黄冈竹楼记》意：“冬宜密雪，有碎玉声；宜鼓琴，琴调和畅。”文中亦言“醉”酒。</span></span></span></p></div></div>
<p class="ctx after"><i>后文</i>宝钗笑称好，也忙联道：</p>
<p class="src">注释：蔡义江《红楼梦诗词曲赋全解》（复旦大学出版社），第154–161页</p><div class="pn"><a href="Z050-37.html">‹ 上一首　芦雪广即景联句·37/43</a><a href="Z050-39.html">下一首　芦雪广即景联句·39/43 ›</a></div>
