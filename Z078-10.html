<h1>姽婳词·其三·8/11</h1>

<p class="ctx"><i>前文</i>“又一段。底下怎样？”宝玉道：</p>

<div class="lines"><div class="vl"><p>明年流寇走山<span class="nb">东<button type="button" class="nm" data-k="n0-0" aria-label="注释⑧">⑧</button><span class="jz nz"><span class="one" data-k="n0-0">流寇：流窜的盗贼，亦常作为对农民起义军的诬蔑称呼。 走：奔驰。山东：太行山之东。
</span></span>，</span>吞虎豹势如<span class="nb">蜂<button type="button" class="nm" data-k="n0-1" aria-label="注释⑨">⑨</button><span class="jz nz"><span class="one" data-k="n0-1">强吞虎豹：即强吞如虎豹。</span></span>。</span></p></div></div>
<p class="ctx after"><i>后文</i>众人道：“好个‘走’字！便见得高低了。且通句转的也不板。”</p>
<p class="src">注释：蔡义江《红楼梦诗词曲赋全解》（复旦大学出版社），第215–218页</p><div class="pn"><a href="Z078-09.html">‹ 上一首　姽婳词·其三·7/11</a><a href="Z078-11.html">下一首　姽婳词·其三·9/11 ›</a></div>
