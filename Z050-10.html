<h1>芦雪广即景联句·10/43</h1>

<p class="ctx"><i>前文</i>麝煤融宝鼎， 宝琴道：绮袖笼金貂。光夺窗前镜， 黛玉道：</p>

<div class="lines"><div class="vl"><p>香粘壁上椒。斜风仍故<span class="nb">故<button type="button" class="nm" data-k="n0-0" aria-label="注释①">①</button><span class="jz nz"><span class="one" data-k="n0-0">故故：屡屡，阵阵。</span></span>，</span></p></div></div>
<p class="ctx after"><i>后文</i>宝玉道： 清梦转聊聊。何处梅花笛？ 宝钗道： 谁家碧玉箫？鳌愁坤轴陷， 李纨笑道：“我替你们看热酒去罢。”宝钗命宝琴续联，只见湘云站起来道： 龙斗阵云销。野岸回孤棹， 宝琴也站起道： 吟鞭指灞桥。</p>
<p class="src">注释：蔡义江《红楼梦诗词曲赋全解》（复旦大学出版社），第154–161页</p><div class="pn"><a href="Z050-09.html">‹ 上一首　芦雪广即景联句·9/43</a><a href="Z050-11.html">下一首　芦雪广即景联句·11/43 ›</a></div>
