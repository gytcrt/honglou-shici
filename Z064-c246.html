<h1>深闺有奇女</h1>



<div class="lines"><div class="vl"><p>深闺有奇女，绝世空珠翠。情痴苦累多，未习颜憔悴。哀哉千秋<span class="nb">魂<button type="button" class="nm" data-k="n0-0" aria-label="注释①">①</button><span class="jz nz"><span class="one" data-k="n0-0">千秋魂：指此回中黛玉所作《五美吟》中西施等古代的五个“有才色的女子”。</span></span>，</span>命无二致。 当松 间人，好丑非其类。</p></div></div>

<details class="zhi extra"><summary>其他注 1 条</summary><span class="one"><b>②</b>桑间人：淫荡之人，指尤氏姐妹等。《汉书·地理志》：“卫地有桑间、濮上之阻，男女亦亟聚会，声色生焉。故俗称郑、卫之音。”后多用“桑间”以称淫风。</span></details><p class="src">注释：蔡义江《红楼梦诗词曲赋全解》（复旦大学出版社），第198–199页</p><div class="pn"><a href="Z064-11.html">‹ 上一首　只为同枝贪色欲</a><a href="Z070-01.html">下一首　桃花行 ›</a></div>
