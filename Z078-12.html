<h1>姽婳词·其三·10/11</h1>

<p class="ctx"><i>前文</i>布置、叙事、词藻，无不尽美。且看如何至四娘，必另有妙转奇句。”宝玉又念道：</p>

<div class="lines"><div class="vl"><p>纷纷将士只保身，青州眼见皆灰尘，</p></div><div class="vl"><p>不期忠义明闺<span class="nb">阁<button type="button" class="nm" data-k="n1-0" aria-label="注释⑫">⑫</button><span class="jz nz"><span class="one" data-k="n1-0">不期：想不到。忠义明闺阁：忠义昭明于闺阁，亦即闺阁之人能明忠义。</span></span>，</span>起恒王得意人。</p></div></div>
<p class="ctx after"><i>后文</i>众人都道：“铺叙得委婉。”贾政道：“太多了，底下只怕累赘呢。”</p>
<p class="src">注释：蔡义江《红楼梦诗词曲赋全解》（复旦大学出版社），第215–218页</p><div class="pn"><a href="Z078-11.html">‹ 上一首　姽婳词·其三·9/11</a><a href="Z078-13.html">下一首　姽婳词·其三·11/11 ›</a></div>
