<script id="idx" type="application/json">[{"id":"Z001-01","c":1,"t":"附编·浮生着甚苦奔忙","a":"","x":"浮生著甚苦奔忙？盛席华筵终散场。 悲喜千般同幻渺，古今一梦尽荒唐。 谩言红袖啼痕重，更有情痴抱恨长。 字字看来皆是血，十年辛苦不寻常！"},{"id":"Z001-02","c":1,"t":"石上偈","a":"","x":"无材可去补苍天，枉入红尘若许年。 此系身前身后事，倩谁记去作奇传？"},{"id":"Z001-03","c":1,"t":"自题一绝","a":"","x":"满纸荒唐言，一把辛酸泪！ 都云作者痴，谁解其中味？"},{"id":"Z001-04","c":1,"t":"太虚幻境对联","a":"","x":"假作真时真亦假，无为有处有还无。"},{"id":"Z001-05","c":1,"t":"嘲甄士隐","a":"","x":"惯养娇生笑你痴， 菱花空对雪澌澌。 好防佳节元宵后， 便是烟消火灭时。"},{"id":"Z001-06","c":1,"t":"中秋对月有怀口占一律","a":"","x":"未卜三生愿，频添一段愁。 闷来时敛额，行去几回头。 自顾风前影，谁堪月下俦？ 蟾光如有意，先上玉人楼。"},{"id":"Z001-07","c":1,"t":"咏怀一联","a":"","x":"玉在匮中求善价，钗于奁内待时飞。"},{"id":"Z001-08","c":1,"t":"对月寓怀口号一绝","a":"","x":"时逢三五便团圆，满把晴光护玉栏。 天上一轮才捧出，人间万姓仰头看。"},{"id":"Z001-09","c":1,"t":"好了歌","a":"","x":"世人都晓神仙好，惟有功名忘不了！ 古今将相在何方？荒冢一堆草没了。 世人都晓神仙好，只有金银忘不了！ 终朝只恨聚无多，及到多时眼闭了。 世人都晓神仙好，只有姣妻忘不了！ 君生日日说恩情，君死又随人去了。 世人都晓神仙好，只有儿孙忘不了！ 痴心父母古来多，孝顺儿孙谁见了？"},{"id":"Z001-10","c":1,"t":"好了歌注","a":"","x":"陋室空堂，当年笏满床， 衰草枯杨，曾为歌舞场。 蛛丝儿结满雕梁， 绿纱今又糊在蓬窗上。 说什么脂正浓，粉正香，如何两鬓又成霜？ 昨日黄土陇头送白骨， 今宵红灯帐底卧鸳鸯。 金满箱，银满箱， 展眼乞丐人皆谤。 正叹他人命不长，那知自己归来丧！ 训有方，保不定日后作强梁。 择膏粱，谁承望流落在烟花巷！ 因嫌纱帽小，致使锁枷扛， 昨怜破袄寒，今嫌紫蟒长。 乱烘烘你方唱罢我登场， 反认他乡是故乡。 甚荒唐，到头来都是为他人作嫁衣裳！"},{"id":"Z002-01","c":2,"t":"一局输赢料不真","a":"","x":"一局输赢料不真，香销茶尽尚逡巡。 欲知目下兴衰兆，须问旁观冷眼人。"},{"id":"Z002-02","c":2,"t":"娇杏赞","a":"","x":"偶因一着错， 便为人上人。"},{"id":"Z003-01","c":3,"t":"荣禧堂对联","a":"","x":"座上珠玑昭日月，堂前黼黻焕烟霞。"},{"id":"Z003-02","c":3,"t":"西江月·嘲贾宝玉二首·其一","a":"","x":"无故寻愁觅恨，有时似傻如狂。纵然生得好皮囊，腹内原来草莽。 潦倒不通世务，愚顽怕读文章。行为偏僻性乖张，那管世人诽谤！"},{"id":"Z003-03","c":3,"t":"西江月·嘲贾宝玉二首·其二","a":"","x":"富贵不知乐业，贫穷难耐凄凉。可怜辜负好韶光，于国于家无望。 天下无能第一，古今不肖无双。寄言纨袴与膏粱：莫效此儿形状！"},{"id":"Z004-01","c":4,"t":"捐躯报国恩","a":"","x":"捐躯报君恩，未报躯犹在。眼底物多情，君恩或可待。"},{"id":"Z004-02","c":4,"t":"护官符","a":"","x":"贾不假，白玉为堂金作马。 阿房宫，三百里，住不下金陵一个史。 丰年好大雪，珍珠如土金如铁。"},{"id":"Z005-01","c":5,"t":"春困葳蕤拥绣衾","a":"","x":"春困葳蕤拥绣衾，恍随仙子别红尘。 问谁幻入华胥境？千古风流造孽人。"},{"id":"Z005-02","c":5,"t":"宁府上房对联","a":"","x":"世事洞明皆学问，人情练达即文章。"},{"id":"Z005-03","c":5,"t":"秦氏卧房宋学士秦太虚所书对联","a":"","x":"嫩寒锁梦因春冷，芳气笼人是酒香。"},{"id":"Z005-04","c":5,"t":"春梦歌","a":"","x":"春梦随云散，飞花逐水流。 寄言众儿女，何必觅闲愁。"},{"id":"Z005-05","c":5,"t":"警幻仙姑赋","a":"","x":"方离柳坞，乍出花房。但行处，鸟惊庭树；将到时，影度回廊。仙袂乍飘兮，闻麝兰之馥郁；荷衣欲动兮，听环佩之铿锵。靥笑春桃兮，云堆翠髻；唇绽樱颗兮，榴齿含香。纤腰之楚楚兮，回风舞雪；珠翠之辉辉兮，满额鹅黄。出没花间兮，宜嗔宜喜；徘徊池上兮，若飞若扬。蛾眉颦笑兮，将言而未语；莲步乍移兮，欲止而欲行。羡彼之良质兮，冰清玉润；慕彼之华服兮，熌灼文章；爱彼之貌容兮，香培玉琢；美彼之态度兮，凤翥龙翔。其素若何？春梅绽雪。其洁若何？秋菊披霜。其静若何？松生空谷。其艳若何？霞映澄塘。其文若何？龙游曲沼。其神若何？月射寒江。应惭西子，实愧王嫱。吁！奇矣哉，生于孰地，来自何方？信矣乎，瑶池不二，紫府无双。果何人哉？如斯之美也！"},{"id":"Z005-06","c":5,"t":"假作真时真亦假","a":"","x":"假作真时真亦假，无为有处有还无。滃染。"},{"id":"Z005-07","c":5,"t":"孽海情天对联","a":"","x":"厚地高天，堪叹古今情不尽； 痴男怨女，可怜风月债难偿。"},{"id":"Z005-08","c":5,"t":"薄命司对联","a":"","x":"春恨秋悲皆自惹，花容月貌为谁妍？"},{"id":"Z005-09","c":5,"t":"又副册判词之一","a":"","x":"霁月难逢，彩云易散。 心比天高，身为下贱。 风流灵巧招人怨。 寿夭多因毁谤生，多情公子空牵念。"},{"id":"Z005-10","c":5,"t":"又副册判词之二","a":"","x":"枉自温柔和顺，空云似桂如兰。 堪羡优伶有福，谁知公子无缘。"},{"id":"Z005-11","c":5,"t":"副册判词一首","a":"","x":"根并荷花一茎香，平生遭际实堪伤。 自从两地生孤木，致使香魂返故乡。"},{"id":"Z005-12","c":5,"t":"正册判词之一","a":"","x":"可叹停机德，堪怜咏絮才， 玉带林中挂，金簪雪里埋。"},{"id":"Z005-13","c":5,"t":"正册判词之二","a":"","x":"二十年来辨是非，榴花开处照宫闱。 三春争及初春景，虎兔相逢大梦归。"},{"id":"Z005-14","c":5,"t":"正册判词之三","a":"","x":"才自精明志自高，生于末世运偏消。 清明涕送江边望，千里东风一梦遥。"},{"id":"Z005-15","c":5,"t":"正册判词之四","a":"","x":"富贵又何为？襁褓之间父母违。 展眼吊斜晖，湘江水逝楚云飞。"},{"id":"Z005-16","c":5,"t":"正册判词之五","a":"","x":"欲洁何曾洁，云空未必空。 可怜金玉质，终陷淖泥中。"},{"id":"Z005-17","c":5,"t":"正册判词之六","a":"","x":"子系中山狼，得志便猖狂。 金闺花柳质，一载赴黄粱。"},{"id":"Z005-18","c":5,"t":"正册判词之七","a":"","x":"勘破三春景不长，缁衣顿改昔年妆。 可怜绣户侯门女，独卧青灯古佛旁。"},{"id":"Z005-19","c":5,"t":"正册判词之八","a":"","x":"凡鸟偏从末世来，都知爱慕此生才。 一从二令三人木，哭向金陵事更哀。"},{"id":"Z005-20","c":5,"t":"正册判词之九","a":"","x":"势败休云贵，家亡莫论亲。 偶因济刘氏，巧得遇恩人。"},{"id":"Z005-21","c":5,"t":"正册判词之十","a":"","x":"桃李春风结子完，到头谁似一盆兰。 如冰水好空相妒，枉与他人作笑谈。"},{"id":"Z005-22","c":5,"t":"正册判词之十一","a":"","x":"情天情海幻情身，情既相逢必主淫。 漫言不肖皆荣出，造衅开端实在宁。"},{"id":"Z005-23","c":5,"t":"仙宫房内对联","a":"","x":"幽微灵秀地， 无可奈何天。"},{"id":"Z005-25","c":5,"t":"红楼梦曲·引子","a":"红楼梦引子","x":"开辟鸿蒙，谁为情种？都只为风月情浓。趁着这奈何天、伤怀日、寂寥时，试遣愚衷。因此上，演出这怀金悼玉的《红楼梦》。"},{"id":"Z005-27","c":5,"t":"红楼梦曲·终身误","a":"","x":"都道是金玉良姻，俺只念木石前盟。空对着山中高士晶莹雪，终不忘世外仙姝寂寞林。叹人间，美中不足今方信。纵然是齐眉举案，到底意难平。"},{"id":"Z005-29","c":5,"t":"红楼梦曲·枉凝眉","a":"","x":"一个是阆苑仙葩，一个是美玉无瑕。若说没奇缘，今生偏又遇着他；若说有奇缘，如何心事终虚化？一个枉自嗟呀，一个空劳牵挂。一个是水中月，一个是镜中花。想眼中能有多少泪珠儿，怎经得秋流到冬尽，春流到夏！"},{"id":"Z005-31","c":5,"t":"红楼梦曲·恨无常","a":"恨无常","x":"喜荣华正好，恨无常又到。眼睁睁把万事全抛，荡悠悠把芳魂消耗。望家乡，路远山高。故向爹娘梦里相寻告：儿命已入黄泉，天伦呵，须要退步抽身早！"},{"id":"Z005-33","c":5,"t":"红楼梦曲·分骨肉","a":"","x":"一帆风雨路三千，把骨肉家园齐来抛闪。恐哭损残年，告爹娘，休把儿悬念。自古穷通皆有定，离合岂无缘？从今分两地，各自保平安。奴去也，莫牵连！"},{"id":"Z005-35","c":5,"t":"红楼梦曲·乐中悲","a":"","x":"襁褓中，父母叹双亡。纵居那绮罗丛，谁知娇养？幸生来英豪阔大宽宏量，从未将儿女私情略萦心上。好一似霁月光风耀玉堂。厮配得才貌仙郎，博得个地久天长，准折得幼年时坎坷形状。终久是云散高唐，水涸湘江。这是尘寰中消长数应当，何必枉悲伤！"},{"id":"Z005-37","c":5,"t":"红楼梦曲·世难容","a":"","x":"气质美如兰，才华阜比仙。天生成孤僻人皆罕。你道是啖肉食腥膻，视绮罗俗厌。却不知太高人愈妒，过洁世同嫌。可叹这青灯古殿人将老，辜负了红粉朱楼春色阑。到头来，依旧是风尘肮脏违心愿。好一似无瑕白玉遭泥陷，又何须王孙公子叹无缘。"},{"id":"Z005-39","c":5,"t":"红楼梦曲·喜冤家","a":"","x":"中山狼，无情兽，全不念当日根由。一味的骄奢淫荡贪还构。觑着那侯门艳质同蒲柳，作践的公府千金似下流。叹芳魂艳魄，一载荡悠悠。"},{"id":"Z005-41","c":5,"t":"红楼梦曲·虚花悟","a":"","x":"将那三春看破，桃红柳绿待如何？把这韶华打灭，觅那清淡天和。说什么天上夭桃盛，云中杏蕊多。到头来谁见把秋捱过？则看那白杨村里人呜咽，青枫林下鬼吟哦。更兼着连天衰草遮坟墓。这的是昨贫今富人劳碌，春荣秋谢花折磨。似这般生关死劫谁能躲？闻说道西方宝树唤婆娑，上结着长生果。"},{"id":"Z005-43","c":5,"t":"红楼梦曲·聪明累","a":"","x":"机关算尽太聪明，反算了卿卿性命。生前心已碎，死后性空灵。家富人宁，终有个家亡人散各奔腾。枉费了意悬悬半世心，好一似荡悠悠三更梦。忽喇喇似大厦倾，昏惨惨似灯将尽。呀！一场欢喜忽悲辛。叹人世，终难定！"},{"id":"Z005-45","c":5,"t":"红楼梦曲·留余庆","a":"","x":"留馀庆，留馀庆，忽遇恩人；幸娘亲，幸娘亲，积得阴功。劝人生，济困扶穷，休似俺那爱银钱、忘骨肉的狠舅奸兄！正是乘除加减，上有苍穹。"},{"id":"Z005-47","c":5,"t":"红楼梦曲·晚韶华","a":"","x":"镜里恩情，更那堪梦里功名！那美韶华去之何迅！再休提绣帐鸳衾。只这带珠冠、披凤袄，也抵不了无常性命。虽说是、人生莫受老来贫，也须要阴骘积儿孙。气昂昂头戴簪缨，气昂昂头戴簪缨，光灿灿胸悬金印；威赫赫爵禄高登，威赫赫爵禄高登，昏惨惨黄泉路近。问古来将相可还存？也只是、虚名儿与后人钦敬。"},{"id":"Z005-49","c":5,"t":"红楼梦曲·好事终","a":"","x":"画梁春尽落香尘。擅风情，秉月貌，便是败家的根本。箕裘颓堕皆从敬，家事消亡首罪宁。宿孽总因情。"},{"id":"Z005-51","c":5,"t":"红楼梦曲·收尾·飞鸟各投林","a":"","x":"为官的家业凋零，富贵的金银散尽。有恩的死里逃生，无情的分明报应。欠命的命已还，欠泪的泪已尽。冤冤相报岂非轻，分离聚合皆前定。欲知命短问前生，老来富贵也真侥幸。看破的遁入空门，痴迷的枉送了性命。好一似食尽鸟投林，落了片白茫茫大地真干净！"},{"id":"Z005-52","c":5,"t":"一场幽梦同谁近","a":"","x":"一场幽梦同谁近，千古情人独我痴。"},{"id":"Z006-01","c":6,"t":"朝叩富儿门","a":"","x":"朝叩富儿门，富儿犹未足。虽无千金酬，嗟彼胜骨肉。"},{"id":"Z006-02","c":6,"t":"得意浓时易接济","a":"","x":"得意浓时易接济，受恩深处胜亲朋。"},{"id":"Z007-01","c":7,"t":"十二花容色最新","a":"","x":"十二花容色最新，不知谁是惜花人？ 相逢若问名何氏？家住江南姓本秦。"},{"id":"Z007-02","c":7,"t":"不因俊俏难为友","a":"","x":"不因俊俏难为友，正为风流始读书。"},{"id":"Z008-01","c":8,"t":"嘲顽石幻相","a":"","x":"女娲炼石已荒唐，又向荒唐演大荒。 失去幽灵真境界，幻来亲就臭皮囊。 好知运败金无彩，堪叹时乖玉不光。 白骨如山忘姓氏，无非公子与红妆。"},{"id":"Z008-02","c":8,"t":"早知日后闲争气","a":"","x":"早知日后闲争气，岂肯今朝错读书。"},{"id":"Z011-01","c":11,"t":"赞会芳园","a":"","x":"黄花满地，白柳横坡。小桥通若耶之溪，曲径接天台之路。石中清流激湍，篱落飘香；树头红叶翩翻，疏林如画。西风乍紧，初罢莺啼；暖日当暄，又添蛩语。遥望东南，建几处依山之榭；纵观西北，结三间临水之轩。笙簧盈耳，别有幽情；罗绮穿林，倍添韵致。"},{"id":"Z013-01","c":13,"t":"梦秦氏赠言","a":"","x":"三春去后诸芳尽，各自须寻各自门。"},{"id":"Z013-03","c":13,"t":"金紫万千谁治国","a":"","x":"金紫万千谁治国，裙钗一二可齐家。"},{"id":"Z017-01","c":17,"t":"题大观园诸景对额·沁芳","a":"","x":"绕堤柳借三篙翠， 隔岸花分一脉香。"},{"id":"Z017-02","c":17,"t":"题大观园诸景对额·有凤来仪","a":"","x":"宝鼎茶闲烟尚绿， 幽窗棋罢指犹凉。"},{"id":"Z017-03","c":17,"t":"题大观园诸景对额·杏帘在望——稻香村","a":"","x":"新涨绿添浣葛处， 好云香护采芹人。"},{"id":"Z017-04","c":17,"t":"题大观园诸景对额·兰风蕙露","a":"","x":"三径香风飘玉蕙， 一庭明月照金兰。"},{"id":"Z017-05","c":17,"t":"题大观园诸景对额·蘅芷清芬","a":"","x":"吟成豆蔻才犹艳， 睡足酴醿梦也香。”"},{"id":"Z018-01","c":18,"t":"赞省亲别墅","a":"","x":"金门玉户神仙府，桂殿兰宫妃子家。"},{"id":"Z018-03","c":18,"t":"大观园题咏·题大观园","a":"顾恩思义”匾额","x":"天地启宏慈，赤子苍头同感戴； 古今垂旷典，九州万国被恩荣。 此一匾一联书于正殿。 衔山抱水建来精，多少工夫筑始成。 天上人间诸景备，芳园应锡大观名。"},{"id":"Z018-07","c":18,"t":"大观园题咏·旷性怡情","a":"旷性怡情”匾额 迎春","x":"园成景备特精奇，奉命羞题额旷怡。 谁信世间有此境，游来宁不畅神思？"},{"id":"Z018-10","c":18,"t":"大观园题咏·万象争辉","a":"探春","x":"名园筑出势巍巍，奉命何惭学浅微。 精妙一时言不出，果然万物生光辉。"},{"id":"Z018-13","c":18,"t":"大观园题咏·文章造化","a":"惜春","x":"山水横拖千里外，楼台高起五云中。 园修日月光辉里，景夺文章造化功。"},{"id":"Z018-16","c":18,"t":"大观园题咏·文采风流","a":"李纨","x":"秀水明山抱复回，风流文采胜蓬莱。 绿裁歌扇迷芳草，红衬湘裙舞落梅。 珠玉自应传盛世，神仙何幸下瑶台。 名园一自邀游赏，未许凡人到此来。"},{"id":"Z018-19","c":18,"t":"大观园题咏·凝晖钟瑞","a":"薛宝钗","x":"芳园筑向帝城西，华日祥云笼罩奇。 高柳喜迁莺出谷，修篁时待凤来仪。 文风已着宸游夕，孝化应隆归省时。 睿藻仙才盈彩笔，自惭何敢再为辞？"},{"id":"Z018-22","c":18,"t":"大观园题咏·世外仙源","a":"林黛玉","x":"名园筑何处，仙境别红尘。 借得山川秀，添来景物新。 香融金谷酒，花媚玉堂人。 何幸邀恩宠，宫车过往频？"},{"id":"Z018-25","c":18,"t":"大观园题咏·有凤来仪","a":"有凤来仪","x":"秀玉初成实，堪宜待凤凰。 竿竿青欲滴，个个绿生凉。 迸砌防阶水，穿帘碍鼎香。 莫摇清碎影，好梦昼初长。"},{"id":"Z018-27","c":18,"t":"大观园题咏·蘅芷清芬","a":"","x":"蘅芜满净苑，萝薜助芬芳。 软衬三春草，柔拖一缕香。 轻烟迷曲径，冷翠滴回廊。 谁谓池塘曲，谢家幽梦长。"},{"id":"Z018-29","c":18,"t":"大观园题咏·怡红快绿","a":"","x":"深庭长日静，两两出婵娟。 绿蜡春犹卷，红妆夜未眠。 凭栏垂绛袖，倚石护青烟。 对立东风里，主人应解怜。"},{"id":"Z018-31","c":18,"t":"大观园题咏·杏帘在望","a":"","x":"杏帘招客饮，在望有山庄。 菱荇鹅儿水，桑榆燕子梁。 一畦春韭绿，十里稻花香。 盛世无饥馁，何须耕织忙。"},{"id":"Z019-c84","c":19,"t":"彩笔辉光若转环","a":"","x":"彩笔辉光若转环，心情魔态几千般。写成浓淡兼深浅，活现痴人恋恋间"},{"id":"Z020-c85","c":20,"t":"智慧生魔多象","a":"","x":"智慧生魔多象，魔生智慧方深。智慧寂灭万缘根，不解智魔作甚"},{"id":"Z021-01","c":21,"t":"续《庄子·胠箧》文","a":"","x":"故绝圣弃知，大盗乃止；擿玉毁珠，小盗不起；焚符破玺，而民朴鄙；掊斗折衡，而民不争；殚残天下之圣法，而民始可与论议。擢乱六律，铄绝竽瑟，塞瞽旷之耳，而天下始人含其聪矣；灭文章，散五采，胶离朱之目，而天下始人含其明矣；毁绝钩绳而弃规矩，攦工倕之指，而天下始人有其巧矣。 焚花散麝，而闺阁始人含其劝矣，戕宝钗之仙姿，灰黛玉之灵窍，丧减情意，而闺阁之美恶始相类矣。彼含其劝，则无参商之虞矣，戕其仙姿，无恋爱之心矣，灰其灵窍，无才思之情矣。彼钗、玉、花、麝者，皆张其罗而穴其隧，所以迷眩缠陷天下者也。"},{"id":"Z021-03","c":21,"t":"题宝玉续庄子文后","a":"","x":"无端弄笔是何人？作践南华《庄子因》。 不悔自己无见识，却将丑语怪他人。"},{"id":"Z021-04","c":21,"t":"淑女从来多抱怨","a":"","x":"淑女从来多抱怨，娇妻自古便含酸。"},{"id":"Z022-01","c":22,"t":"《山门》中《寄生草》曲","a":"","x":"漫揾英雄泪，相离处士家。谢慈悲剃度在莲台下。没缘法转眼分离乍。赤条条来去无牵挂。那里讨烟蓑雨笠卷单行？一任俺芒鞋破钵随缘化！"},{"id":"Z022-02","c":22,"t":"参禅偈","a":"","x":"你证我证，心证意证。 是无有证，斯可云证。 无可云证，是立足境。"},{"id":"Z022-03","c":22,"t":"寄生草·解偈","a":"","x":"无我原非你，从他不解伊。肆行无碍凭来去。茫茫着甚悲愁喜，纷纷说甚亲疏密。从前碌碌却因何，到如今回头试想真无趣！"},{"id":"Z022-04","c":22,"t":"春灯谜·其一","a":"","x":"大哥有角只八个，二哥有角只两根。 大哥只在床上坐，二哥爱在房上蹲。"},{"id":"Z022-05","c":22,"t":"春灯谜·其二","a":"","x":"猴子身轻站树梢。打一果名。"},{"id":"Z022-06","c":22,"t":"春灯谜·其三","a":"","x":"身自端方，体自坚硬。虽不能言，有言必应。打一用物。"},{"id":"Z022-07","c":22,"t":"春灯谜·其四","a":"","x":"能使妖魔胆尽摧，身如束帛气如雷。 一声震得人方恐，回首相看已化灰。"},{"id":"Z022-08","c":22,"t":"春灯谜·其五","a":"","x":"天运人功理不穷，有功无运也难逢。 因何镇日纷纷乱，只为阴阳数不同。"},{"id":"Z022-09","c":22,"t":"春灯谜·其六","a":"","x":"阶下儿童仰面时，清明妆点最堪宜。 游丝一断浑无力，莫向东风怨别离。"},{"id":"Z022-10","c":22,"t":"春灯谜·其七","a":"","x":"前身色相总无成，不听菱歌听佛经。 莫道此生沉黑海，性中自有大光明。"},{"id":"Z022-11","c":22,"t":"春灯谜·其八","a":"","x":"朝罢谁携两袖烟，琴边衾里总无缘。 晓筹不用鸡人报，五夜无烦侍女添。 焦首朝朝还暮暮，煎心日日复年年。 光阴荏苒须当惜，风雨阴晴任变迁。"},{"id":"Z022-c101","c":22,"t":"禅理偏成曲调","a":"","x":"禅理偏成曲调，灯谜巧隐谶言。其中冷暖自寻看，昼夜因循暗转"},{"id":"Z023-02","c":23,"t":"四时即事·春夜即事","a":"春夜即事","x":"霞绡云幄任铺陈，隔巷蟆更听未真。 枕上轻寒窗外雨，眼前春色梦中人。 盈盈烛泪因谁泣，默默花愁为我嗔。 自是小鬟娇懒惯，拥衾不耐笑言频。"},{"id":"Z023-04","c":23,"t":"四时即事·夏夜即事","a":"","x":"倦绣佳人幽梦长，金笼鹦鹉唤茶汤。 窗明麝月开宫镜，室霭檀云品御香。 琥珀杯倾荷露滑，玻璃槛纳柳风凉。 水亭处处齐纨动，帘卷朱楼罢晚妆。"},{"id":"Z023-06","c":23,"t":"四时即事·秋夜即事","a":"","x":"绛芸轩里绝喧哗，桂魄流光浸茜纱。 苔锁石纹容睡鹤，井飘桐露湿栖鸦。 抱衾婢至舒金凤，倚槛人归落翠花。 静夜不眠因酒渴，沉烟重拨索烹茶。"},{"id":"Z023-08","c":23,"t":"四时即事·冬夜即事","a":"","x":"梅魂竹梦已三更，锦罽鹴衾睡未成。 松影一庭惟见鹤，梨花满地不闻莺。 女儿翠袖诗怀冷，公子金貂酒力轻。 却喜侍儿知试茗，扫将新雪及时烹。"},{"id":"Z023-09","c":23,"t":"妆晨绣夜心无矣","a":"","x":"妆晨绣夜心无矣，对月临风恨有之。"},{"id":"Z023-c107","c":23,"t":"群艳大观中","a":"","x":"群艳大观中，柳弱系轻风。惜花与度曲，笑看利名空"},{"id":"Z025-01","c":25,"t":"癞和尚赞","a":"","x":"鼻如悬胆两眉长，目似明星蓄宝光， 破衲芒鞋无住迹，腌臜更有满头疮。"},{"id":"Z025-02","c":25,"t":"跛道人赞","a":"","x":"一足高来一足低，浑身带水又拖泥。 相逢若问家何处，却在蓬莱弱水西。"},{"id":"Z025-03","c":25,"t":"叹通灵玉二首·其一","a":"","x":"天不拘兮地不羁，心头无喜亦无悲； 却因煅炼通灵后，便向人间觅是非。"},{"id":"Z025-04","c":25,"t":"叹通灵玉二首·其二","a":"","x":"粉渍脂痕污宝光，绮栊昼夜困鸳鸯。 沉酣一梦终须醒，冤孽偿清好散场！”"},{"id":"Z026-01","c":26,"t":"黛玉哭花阴","a":"","x":"花魂默默无情绪，鸟梦痴痴何处惊。"},{"id":"Z026-02","c":26,"t":"哭花阴诗","a":"","x":"颦儿才貌世应希，独抱幽芳出绣闺； 呜咽一声犹未了，落花满地鸟惊飞。"},{"id":"Z026-c114","c":26,"t":"个是时才得传消息","a":"","x":"个是时才得传消息，一个是旧喜化作新歌。真真假假事堪疑，哭向花林月底"},{"id":"Z027-01","c":27,"t":"葬花吟","a":"","x":"花谢花飞飞满天，红消香断有谁怜？ 游丝软系飘春榭，落絮轻沾扑绣帘。 闺中女儿惜春暮，愁绪满怀无释处， 手把花锄出绣帘，忍踏落花来复去。 柳丝榆荚自芳菲，不管桃飘与李飞。 桃李明年能再发，明年闺中知有谁？ 三月香巢已垒成，梁间燕子太无情！ 明年花发虽可啄，却不道人去梁空巢也倾。 一年三百六十日，风刀霜剑严相逼， 明媚鲜妍能几时，一朝飘泊难寻觅。 花开易见落难寻，阶前闷杀葬花人， 独倚花锄泪暗洒，洒上空枝见血痕。 杜鹃无语正黄昏，荷锄归去掩重门。 青灯照壁人初睡，冷雨敲窗被未温。 怪奴底事倍伤神，半为怜春半恼春： 怜春忽至恼忽去，至又无言去不闻。 昨宵庭外悲歌发，知是花魂与鸟魂？ 花魂鸟魂总难留，鸟自无言花自羞。 愿奴胁下生双翼，随花飞到天尽头。 天尽头，何处有香丘？ 未若锦囊收艳骨，一抔净土掩风流。 质本洁来还洁去，强于污淖陷渠沟。 尔今死去侬收葬，未卜侬身何日丧？ 侬今葬花人笑痴，他年葬侬知是谁？ 试看春残花渐落，便是红颜老死时。 一朝春尽红颜老，花落人亡两不知！"},{"id":"Z028-01","c":28,"t":"小曲","a":"","x":"两个冤家，都难丢下，想着你来又记挂着他。两个人形容俊俏，都难描画。想昨宵幽期私订在荼蘼架，一个偷情，一个寻拿，拿住了三曹对案，我也无回话。"},{"id":"Z028-02","c":28,"t":"“女儿”酒令·其一","a":"","x":"滴不尽相思血泪抛红豆，开不完春柳春花满画楼。睡不稳纱窗风雨黄昏后，忘不了新愁与旧愁，咽不下玉粒金莼噎满喉，照不见菱花镜里形容瘦。展不开的眉头，捱不明的更漏。呀！恰便似遮不住的青山隐隐，流不断的绿水悠悠。"},{"id":"Z028-03","c":28,"t":"“女儿”酒令·其二","a":"","x":"你是个可人，你是个多情，你是个刁钻古怪鬼灵精，你是个神仙也不灵。我说的话儿你全不信，只叫你去背地里细打听，才知道我疼你不疼！"},{"id":"Z028-04","c":28,"t":"“女儿”酒令·其三","a":"","x":"豆蔻开花三月三，一个虫儿往里钻。钻了半日不得进去，爬到花儿上打秋千。肉儿小心肝，我不开了你怎么钻？"},{"id":"Z028-05","c":28,"t":"“女儿”酒令·其五","a":"","x":"可喜你天生成百媚娇，恰便似活神仙离云霄。度青春，年正小；配鸾凤，真也着。呀！看天河正高，听谯楼鼓敲，剔银灯同入鸳帏悄。"},{"id":"Z034-01","c":34,"t":"题帕三绝句","a":"","x":"眼空蓄泪泪空垂，暗洒闲抛却为谁？ 尺幅鲛鮹劳解赠，叫人焉得不伤悲！ 抛珠滚玉只偷潸，镇日无心镇日闲； 枕上袖边难拂拭，任他点点与斑斑。 彩线难收面上珠，湘江旧迹已模糊； 窗前亦有千竿竹，不识香痕渍也无？"},{"id":"Z037-01","c":37,"t":"招宝玉结诗社帖","a":"","x":"娣探谨奉 二兄文几：前夕新霁，月色如洗，因惜清景难逢，讵忍就卧，时漏已三转，犹徘徊于桐槛之下，未防风露所欺，致获采薪之患。昨蒙亲劳抚嘱，复又数遣侍儿问切，兼以鲜荔并真卿墨迹见赐，何痌瘝惠爱之深哉！今因伏几凭床处默之时，因思及历来古人中处名攻利敌之场，犹置一些山滴水之区，远招近揖，投辖攀辕，务结二三同志盘桓于其中，或竖词坛，或开吟社，虽一时之偶兴，遂成千古之佳谈。娣虽不才，窃同叨栖处于泉石之间，而兼慕薛林之技。风庭月榭，惜未宴集诗人；帘杏溪桃，或可醉飞吟盏。孰谓莲社之雄才，独许须眉；直以东山之雅会，让余脂粉。若蒙棹雪而来，娣则扫花以待。此谨奉。"},{"id":"Z037-02","c":37,"t":"送白海棠帖","a":"","x":"不肖男芸恭请 父亲大人万福金安。男思自蒙天恩，认于膝下，日夜思一孝顺，竟无可孝顺之处。前因买办花草，上托大人金福，竟认得许多花儿匠，并认得许多名园。因忽见有白海棠一种，不可多得。故变尽方法，只弄得两盆。大人若视男是亲男一般，便留下赏玩。因天气暑热，恐园中姑娘们不便，故不敢面见。奉书恭启，并叩台安。男芸跪书。"},{"id":"Z037-04","c":37,"t":"咏白海棠","a":"咏白海棠·限门盆魂痕昏","x":"斜阳寒草带重门，苔翠盈铺雨后盆。 玉是精神难比洁，雪为肌骨易消魂。 芳心一点娇无力，倩影三更月有痕。 莫谓缟仙能羽化，多情伴我咏黄昏。"},{"id":"Z037-05","c":37,"t":"咏白海棠·其一","a":"","x":"珍重芳姿昼掩门，秾艳之语，一洗皆尽。非不能也，屑而不为也。最恨近日小说中，一百美人诗词语气，只得一个艳稿。自携手瓮灌苔盆。 胭脂洗出秋阶影，冰雪招来露砌魂。 淡极始知花更艳，愁多焉得玉无痕。 欲偿白帝凭清洁，不语婷婷日又昏。"},{"id":"Z037-06","c":37,"t":"咏白海棠·其三","a":"","x":"秋容浅淡映重门，七节攒成雪满盆。 出浴太真冰作影，捧心西子玉为魂。 晓风不散愁千点，宿雨还添泪一痕。 独倚画栏如有意，清砧怨笛送黄昏。"},{"id":"Z037-07","c":37,"t":"咏白海棠·其四","a":"","x":"半卷湘帘半掩门，碾冰为土玉为盆。 偷来梨蕊三分白，借得梅花一缕魂。 月窟仙人缝缟袂，秋闺怨女拭啼痕。 娇羞默默同谁诉，倦倚西风夜已昏。"},{"id":"Z037-11","c":37,"t":"白海棠和韵二首·其一","a":"其一","x":"神仙昨日降都门，种得蓝田玉一盆。 自是霜娥偏爱冷，非关倩女亦离魂。 秋阴捧出何方雪，雨渍添来隔宿痕。 却喜诗人吟不倦，岂令寂寞度朝昏。"},{"id":"Z037-13","c":37,"t":"白海棠和韵二首·其二","a":"","x":"蘅芷阶通萝薜门，也宜墙角也宜盆。 花因喜洁难寻偶，人为悲秋易断魂。 玉烛滴干风里泪，晶帘隔破月中痕。 幽情欲向嫦娥诉，无奈虚廊夜色昏。"},{"id":"Z038-01","c":38,"t":"藕香榭对联","a":"","x":"芙蓉影破归兰桨，菱藕香深写竹桥。"},{"id":"Z038-04","c":38,"t":"菊花诗·忆菊","a":"忆菊 蘅芜君","x":"怅望西风抱闷思，蓼红苇白断肠时。 空篱旧圃秋无迹，瘦月清霜梦有知。 念念心随归雁远，寥寥坐听晚砧痴。 谁怜我为黄花病，慰语重阳会有期。"},{"id":"Z038-07","c":38,"t":"菊花诗·访菊","a":"怡红公子","x":"闲趁霜晴试一游，酒杯药盏莫淹留。 霜前月下谁家种，槛外篱边何处秋。 蜡屐远来情得得，冷吟不尽兴悠悠。 黄花若解怜诗客，休负今朝挂杖头。"},{"id":"Z038-10","c":38,"t":"菊花诗·种菊","a":"怡红公子","x":"携锄秋圃自移来，篱畔庭前故故栽。 昨夜不期经雨活，今朝犹喜带霜开。 冷吟秋色诗千首，醉酹寒香酒一杯。 泉溉泥封勤护惜，好知井迳绝尘埃。"},{"id":"Z038-13","c":38,"t":"菊花诗·对菊","a":"枕霞旧友","x":"别圃移来贵比金，一丛浅淡一丛深。 萧疏篱畔科头坐，清冷香中抱膝吟。 数去更无君傲世，看来惟有我知音。 秋光荏苒休辜负，相对原宜惜寸阴。"},{"id":"Z038-16","c":38,"t":"菊花诗·供菊","a":"枕霞旧友","x":"弹琴酌酒喜堪俦，几案婷婷点缀幽。 隔座香分三径露，抛书人对一枝秋。 霜清纸帐来新梦，圃冷斜阳忆旧游。 傲世也因同气味，春风桃李未淹留。"},{"id":"Z038-19","c":38,"t":"菊花诗·咏菊","a":"潇湘妃子","x":"无赖诗魔昏晓侵，绕篱欹石自沉音。 毫端蕴秀临霜写，口齿噙香对月吟。 满纸自怜题素怨，片言谁解诉秋心。 一从陶令平章后，千古高风说到今。"},{"id":"Z038-22","c":38,"t":"菊花诗·画菊","a":"蘅芜君","x":"诗馀戏笔不知狂，岂是丹青费较量。 聚叶泼成千点墨，攒花染出几痕霜。 淡浓神会风前影，跳脱秋生腕底香。 莫认东篱闲采掇，粘屏聊以慰重阳。"},{"id":"Z038-25","c":38,"t":"菊花诗·问菊","a":"潇湘妃子","x":"欲讯秋情众莫知，喃喃负手叩东篱。 孤标傲世偕谁隐，一样花开为底迟？ 圃露庭霜何寂寞，雁归蛩病可相思？ 休言举世无谈者，解语何妨片语时。"},{"id":"Z038-28","c":38,"t":"菊花诗·簪菊","a":"蕉下客","x":"瓶供篱栽日日忙，折来休认镜中妆。 长安公子因花癖，彭泽先生是酒狂。 短鬓冷沾三径露，葛巾香染九秋霜。 高情不入时人眼，拍手凭他笑路旁。"},{"id":"Z038-31","c":38,"t":"菊花诗·菊影","a":"枕霞旧友","x":"秋光叠叠复重重，潜度偷移三径中。 窗隔疏灯描远近，篱筛破月锁玲珑。 寒芳留照魂应驻，霜印传神梦也空。 珍重暗香休踏碎，凭谁醉眼认朦胧。"},{"id":"Z038-34","c":38,"t":"菊花诗·菊梦","a":"潇湘妃子","x":"篱畔秋酣一觉清，和云伴月不分明。 登仙非慕庄生蝶，忆旧还寻陶令盟。 睡去依依随雁断，惊回故故恼蛩鸣。 醒时幽怨同谁诉，衰草寒烟无限情。"},{"id":"Z038-37","c":38,"t":"菊花诗·残菊","a":"蕉下客","x":"露凝霜重渐倾欹，宴赏才过小雪时。 蒂有馀香金淡泊，枝无全叶翠离披。 半床落月蛩声病，万里寒云雁阵迟。 明岁秋风知再会，暂时分手莫相思。"},{"id":"Z038-38","c":38,"t":"螃蟹咏·其一","a":"","x":"持螯更喜桂阴凉，泼醋擂姜兴欲狂。 饕餮王孙应有酒，横行公子却无肠。 脐间积冷馋忘忌，指上沾腥洗尚香。 原为世人美口腹，坡仙曾笑一生忙。"},{"id":"Z038-39","c":38,"t":"螃蟹咏·其二","a":"","x":"铁甲长戈死未忘，堆盘色相喜先尝。 螯封嫩玉双双满，壳凸红脂块块香。 多肉更怜卿八足，助情谁劝我千觞。 对斯佳品酬佳节，桂拂清风菊带霜。"},{"id":"Z038-40","c":38,"t":"螃蟹咏·其三","a":"","x":"桂霭桐阴坐举觞，长安涎口盼重阳。 眼前道路无经纬，皮里春秋空黑黄。 酒未敌腥还用菊，性防积冷定须姜。 于今落釜成何益，月浦空馀禾黍香。"},{"id":"Z040-01","c":40,"t":"探春房内对联","a":"","x":"烟霞闲骨格，泉石野生涯。"},{"id":"Z045-01","c":45,"t":"代别离·秋窗风雨夕","a":"","x":"秋花惨淡秋草黄，耿耿秋灯秋夜长。 已觉秋窗秋不尽，那堪风雨助凄凉！ 助秋风雨来何速！惊破秋窗秋梦绿。 抱得秋情不忍眠，自向秋屏移泪烛。 泪烛摇摇爇短檠，牵愁照恨动离情。 谁家秋院无风入？何处秋窗无雨声？ 罗衾不奈秋风力，残漏声催秋雨急。 连宵脉脉复飕飕，灯前似伴离人泣。 寒烟小院转萧条，疏竹虚窗时滴沥。 不知风雨几时休，已教泪洒窗纱湿。"},{"id":"Z048-01","c":48,"t":"吟月三首·其一","a":"","x":"月挂中天夜色寒，清光皎皎影团团。 诗人助兴常思玩，野客添愁不忍观。 翡翠楼边悬玉镜，珍珠帘外挂冰盘。 良宵何用烧银烛，晴彩辉煌映画栏。"},{"id":"Z048-02","c":48,"t":"吟月三首·其二","a":"","x":"非银非水映窗寒，试看晴空护玉盘。 淡淡梅花香欲染，丝丝柳带露初干。 只疑残粉涂金砌，恍若轻霜抹玉栏。 梦醒西楼人迹绝，馀容犹可隔帘看。"},{"id":"Z049-01","c":49,"t":"吟月三首·其三","a":"","x":"精华欲掩料应难，影自娟娟魄自寒。 一片砧敲千里白，半轮鸡唱五更残。 绿蓑江上秋闻笛，红袖楼头夜倚栏。 博得嫦娥应借问，缘何不使永团圆！"},{"id":"Z050-01","c":50,"t":"芦雪广即景联句","a":"","x":"一夜北风紧 开门雪尚飘。入泥怜洁白， 匝地惜琼瑶。有意荣枯草， 无心饰萎苕。价高村酿熟， 年稔府粱饶。葭动灰飞管， 阳回斗转杓。寒山已失翠， 冻浦不闻潮。易挂疏枝柳， 难堆破叶蕉。麝煤融宝鼎， 绮袖笼金貂。光夺窗前镜， 香粘壁上椒。斜风仍故故， 清梦转聊聊。何处梅花笛？ 谁家碧玉箫？鳌愁坤轴陷， 龙斗阵云销。野岸回孤棹， 吟鞭指灞桥。赐裘怜抚戍， 加絮念征徭。坳垤审夷险， 枝柯怕动摇。皑皑轻趁步， 剪剪舞随腰。煮芋成新赏， 撒盐是旧谣。苇蓑犹泊钓， 林斧不闻樵。伏象千峰凸， 盘蛇一径遥。花缘经冷结， 色岂畏霜凋。深院惊寒雀， 空山泣老鸮。阶墀随上下， 池水任浮漂。照耀临清晓， 缤纷入永宵。诚忘三尺冷， 瑞释九重焦。僵卧谁相问， 狂游客喜招。天机断缟带， 海市失鲛绡。 寂寞对台榭， 清贫怀箪瓢。 烹茶冰渐沸， 煮酒叶难烧。 没帚山僧扫， 埋琴稚子挑。 石楼闲睡鹤， 锦罽暖亲猫。 月窟翻银浪， 霞城隐赤标。 沁梅香可嚼， 淋竹醉堪调。 或湿鸳鸯带， 时凝翡翠翘。 无风仍脉脉， 不雨亦潇潇。 欲志今朝乐， 凭诗祝舜尧。"},{"id":"Z050-48","c":50,"t":"赋得红梅花·咏红梅花得红字","a":"咏红梅花得“红”字 邢岫烟","x":"桃未芳菲杏未红，冲寒先已笑东风。 魂飞庾岭春难辨，霞隔罗浮梦未通。 绿萼添妆融宝炬，缟仙扶醉跨残虹。 看来岂是寻常色，浓淡由他冰雪中。"},{"id":"Z050-51","c":50,"t":"赋得红梅花·咏红梅花得梅字","a":"","x":"白梅懒赋赋红梅，逞艳先迎醉眼开。 冻脸有痕皆是血，酸心无恨亦成灰。 误吞丹药移真骨，偷下瑶池脱旧胎。 江北江南春灿烂，寄言蜂蝶漫疑猜。"},{"id":"Z050-54","c":50,"t":"赋得红梅花·咏红梅花得花字","a":"薛宝琴","x":"疏是枝条艳是花，春妆儿女竞奢华。 闲庭曲槛无馀雪，流水空山有落霞。 幽梦冷随红袖笛，游仙香泛绛河槎。 前身定是瑶台种，无复相疑色相差。"},{"id":"Z050-55","c":50,"t":"访妙玉乞红梅","a":"","x":"酒未开樽句未裁， 寻春问腊到蓬莱。 不求大士瓶中露，为乞嫦娥槛外梅。 入世冷挑红雪去，离尘香割紫云来。 槎枒谁惜诗肩瘦，衣上犹沾佛院苔。"},{"id":"Z050-59","c":50,"t":"点绛唇·耍的猴儿谜","a":"","x":"溪壑分离，红尘游戏，真何趣？名利犹虚，后事终难继。"},{"id":"Z050-60","c":50,"t":"灯谜诗·其一","a":"","x":"镂檀锲梓一层层，岂系良工堆砌成？"},{"id":"Z050-61","c":50,"t":"灯谜诗·其二","a":"","x":"天上人间两渺茫，琅玕节过谨堤防。 鸾音鹤信须凝睇，好把唏嘘答上苍。"},{"id":"Z050-62","c":50,"t":"灯谜诗·其三","a":"","x":"騄駬何劳缚紫绳？驰城逐堑势狰狞。 主人指示风雷动，鳌背三山独立名。"},{"id":"Z051-02","c":51,"t":"怀古绝句·赤壁怀古","a":"赤壁怀古其一","x":"赤壁沉埋水不流，徒留名姓载空舟。 喧阗一炬悲风冷，无限英魂在内游。"},{"id":"Z051-04","c":51,"t":"怀古绝句·交趾怀古","a":"","x":"铜铸金镛振纪纲，声传海外播戎羌。 马援自是功劳大，铁笛无烦说子房。"},{"id":"Z051-06","c":51,"t":"怀古绝句·钟山怀古","a":"","x":"名利何曾伴汝身，无端被诏出凡尘。 牵连大抵难休绝，莫怨他人嘲笑频。"},{"id":"Z051-08","c":51,"t":"怀古绝句·淮阴怀古","a":"","x":"壮士须防恶犬欺，三齐位定盖棺时。 寄言世俗休轻鄙，一饭之恩死也知。"},{"id":"Z051-10","c":51,"t":"怀古绝句·广陵怀古","a":"","x":"蝉噪鸦栖转眼过，隋堤风景近如何。 只缘占得风流号，惹得纷纷口舌多。"},{"id":"Z051-12","c":51,"t":"怀古绝句·桃叶渡怀古","a":"","x":"衰草闲花映浅池，桃枝桃叶总分离。 六朝梁栋多如许，小照空悬壁上题。"},{"id":"Z051-14","c":51,"t":"怀古绝句·青冢怀古","a":"","x":"黑水茫茫咽不流，冰弦拨尽曲中愁。 汉家制度诚堪叹，樗栎应惭万古羞。"},{"id":"Z051-16","c":51,"t":"怀古绝句·马嵬怀古","a":"","x":"寂寞脂痕渍汗光，温柔一旦付东洋。 只因遗得风流迹，此日衣衾尚有香。"},{"id":"Z051-18","c":51,"t":"怀古绝句·蒲东寺怀古","a":"","x":"小红骨贱最身轻，私掖偷携强撮成。 虽被夫人时吊起，已经勾引彼同行。"},{"id":"Z051-20","c":51,"t":"怀古绝句·梅花观怀古","a":"","x":"不在梅边在柳边，个中谁拾画婵娟。 团圆莫忆春香到，一别西风又一年。"},{"id":"Z052-01","c":52,"t":"真真国女儿诗","a":"","x":"昨夜朱楼梦，今宵水国吟。 岛云蒸大海，岚气接丛林。 月本无今古，情缘自浅深。 汉南春历历，焉得不关心。"},{"id":"Z053-01","c":53,"t":"贾祠联额·贾氏宗祠","a":"","x":"肝脑涂地，兆姓赖保育之恩； 功名贯天，百代仰蒸尝之盛。"},{"id":"Z053-02","c":53,"t":"贾祠联额·星辉辅弼","a":"","x":"勋业有光昭日月，功名无间及儿孙。"},{"id":"Z053-03","c":53,"t":"贾祠联额·慎终追远","a":"","x":"已后儿孙承福德，至今黎庶念荣宁。"},{"id":"Z062-01","c":62,"t":"酒令·其一","a":"","x":"落霞与孤鹜齐飞，风急江天过雁哀，却是一只折足雁，叫的人九回肠，这是鸿雁来宾。 榛子非关隔院砧，何来万户捣衣声。"},{"id":"Z062-03","c":62,"t":"酒令·其二","a":"","x":"奔腾而砰湃，江间波浪兼天涌，须要铁锁缆孤舟，既遇着一江风，不宜出行。 这鸭头不是那丫头，头上那讨桂花油。"},{"id":"Z062-05","c":62,"t":"酒令·其三","a":"","x":"泉香而酒冽，玉盏盛来琥珀光，直饮到梅梢月上，醉扶归，却为宜会亲友。"},{"id":"Z063-01","c":63,"t":"花名签·牡丹","a":"","x":"任是无情也动人。"},{"id":"Z063-02","c":63,"t":"《邯郸记》中《赏花时》曲","a":"","x":"翠凤毛翎扎帚叉，闲踏天门扫落花。您看那风起玉尘沙。猛可的那一层云下，抵多少门外即天涯。您再休要剑斩黄龙一线儿差，再休向东老贫穷卖酒家。您与俺眼向云霞。洞宾呵，您得了人可便早些儿回话；若迟呵，错教人留恨碧桃花。"},{"id":"Z063-03","c":63,"t":"花名签·杏花","a":"","x":"日边红杏倚云栽。"},{"id":"Z063-04","c":63,"t":"花名签·老梅","a":"","x":"竹篱茅舍自甘心。"},{"id":"Z063-05","c":63,"t":"花名签·海棠","a":"","x":"只恐夜深花睡去。"},{"id":"Z063-06","c":63,"t":"花名签·荼蘼花","a":"","x":"开到荼縻花事了。"},{"id":"Z063-07","c":63,"t":"花名签·并蒂花","a":"","x":"连理枝头花正开。"},{"id":"Z063-08","c":63,"t":"花名签·芙蓉","a":"","x":"莫怨东风当自嗟。"},{"id":"Z063-09","c":63,"t":"花名签·桃花","a":"","x":"桃红又是一年春。"},{"id":"Z064-02","c":64,"t":"五美吟·西施","a":"西施","x":"一代倾城逐浪花，吴宫空自忆儿家。 效颦莫笑东村女，头白溪边尚浣纱。"},{"id":"Z064-04","c":64,"t":"五美吟·虞姬","a":"","x":"肠断乌骓夜啸风，虞兮幽恨对重瞳。 黥彭甘受他年醢，饮剑何如楚帐中！"},{"id":"Z064-06","c":64,"t":"五美吟·明妃","a":"","x":"绝艳惊人出汉宫，红颜薄命古今同。 君王纵使轻颜色，予夺权何畀画工？"},{"id":"Z064-08","c":64,"t":"五美吟·绿珠","a":"","x":"瓦砾明珠一例抛，何曾石尉重娇娆！ 都缘顽福前生造，更有同归慰寂寥。"},{"id":"Z064-10","c":64,"t":"五美吟·红拂","a":"","x":"长揖雄谈态自殊，美人巨眼识穷途。 尸居馀气杨公幕，岂得羁縻女丈夫！"},{"id":"Z064-11","c":64,"t":"只为同枝贪色欲","a":"","x":"只为同枝贪色欲，致教连理起戈矛。"},{"id":"Z064-c246","c":64,"t":"深闺有奇女","a":"","x":"深闺有奇女，绝世空珠翠。情痴苦累多，未习颜憔悴。哀哉千秋魂，薄命无二致。 当松 间人，好丑非其类。"},{"id":"Z070-01","c":70,"t":"桃花行","a":"","x":"桃花帘外东风软，桃花帘内晨妆懒。 帘外桃花帘内人，人与桃花隔不远。 东风有意揭帘栊，花欲窥人帘不卷。 桃花帘外开仍旧，帘中人比桃花瘦。 花解怜人花也愁，隔帘消息风吹透。 风透湘帘花满庭，庭前春色倍伤情。 闲苔院落门空掩，斜日栏杆人自凭。 凭栏人向东风泣，茜裙偷傍桃花立。 桃花桃叶乱纷纷，花绽新红叶凝碧。 雾裹烟封一万株，烘楼照壁红模糊。 天机烧破鸳鸯锦，春酣欲醒移珊枕。 侍女金盆进水来，香泉影蘸胭脂冷。 胭脂鲜艳何相类，花之颜色人之泪； 若将人泪比桃花，泪自长流花自媚。 泪眼观花泪易干，泪干春尽花憔悴。 憔悴花遮憔悴人，花飞人倦易黄昏。 一声杜宇春归尽，寂寞帘栊空月痕！"},{"id":"Z070-02","c":70,"t":"柳絮词·如梦令","a":"","x":"岂是绣绒残吐，卷起半帘香雾，纤手自拈来，空使鹃啼燕妒。且住，且住！莫使春光别去。"},{"id":"Z070-03","c":70,"t":"柳絮词·南柯子","a":"","x":"空挂纤纤缕，徒垂络络丝，也难绾系也难羁，一任东西南北各分离。 落去君休惜，飞来我自知。莺愁蝶倦晚芳时，纵是明春再见，隔年期！"},{"id":"Z070-05","c":70,"t":"柳絮词·唐多令","a":"","x":"粉堕百花州，香残燕子楼。一团团逐对成球。飘泊亦如人命薄，空缱绻，说风流。 草木也知愁，韶华竟白头！叹今生谁舍谁收？嫁与东风春不管，凭尔去，忍淹留。"},{"id":"Z070-06","c":70,"t":"柳絮词·西江月","a":"","x":"汉苑零星有限，隋堤点缀无穷。三春事业付东风，明月梅花一梦。 几处落红庭院，谁家香雪帘栊？江南江北一般同，偏是离人恨重！"},{"id":"Z070-07","c":70,"t":"柳絮词·临江仙","a":"","x":"白玉堂前春解舞，东风卷得均匀。 蜂团蝶阵乱纷纷。几曾随逝水，岂必委芳尘。 万缕千丝终不改，任他随聚随分。韶华休笑本无根，好风频借力，送我上青云！"},{"id":"Z076-01","c":76,"t":"中秋夜大观园即景联句三十五韵","a":"","x":"三五中秋夕， 清游拟上元。撒天箕斗灿， 匝地管弦繁。几处狂飞盏， 谁家不启轩。轻寒风剪剪， 良夜景暄暄。争饼嘲黄发， 分瓜笑绿媛。香新荣玉桂， 色健茂金萱。蜡烛辉琼宴， 觥筹乱绮园。分曹尊一令， 射覆听三宣。骰彩红成点， 传花鼓滥喧。晴光摇院宇， 素彩接乾坤。赏罚无宾主， 吟诗序仲昆。构思时倚槛， 拟景或依门。酒尽情犹在， 更残乐已谖。渐闻语笑寂， 空剩雪霜痕。阶露团朝菌， 庭烟敛夕棔。秋湍泻石髓， 风叶聚云根。宝婺情孤洁， 银蟾气吐吞。药经灵兔捣， 人向广寒奔。犯斗邀牛女， 乘槎待帝孙。虚盈轮莫定， 晦朔魄空存。壶漏声将涸， 窗灯焰已昏。寒塘渡鹤影， 冷月葬花魂。 香篆销金鼎，脂冰腻玉盆。 箫增嫠妇泣，衾倩侍儿温。 空帐悬文凤，闲屏掩彩鸳。 露浓苔更滑，霜重竹难扪。 犹步萦纡沼，还登寂历原。 石奇神鬼搏，木怪虎狼蹲。 赑屃朝光透，罘罳晓露屯。 振林千树鸟，啼谷一声猿。 歧熟焉忘径，泉知不问源。 钟鸣栊翠寺，鸡唱稻香村。 有兴悲何继，无愁意岂烦。 芳情只自遣，雅趣向谁言。 彻旦休云倦，烹茶更细论。"},{"id":"Z078-01","c":78,"t":"姽婳词·其一","a":"","x":"姽婳将军林四娘，玉为肌骨铁为肠， 捐躯自报恒王后，此日青州土亦香。"},{"id":"Z078-02","c":78,"t":"姽婳词·其二","a":"","x":"红粉不知愁，将军意未休。 掩啼离绣幕，抱恨出青州。 自谓酬王德，讵能复寇仇。 谁题忠义墓，千古独风流。"},{"id":"Z078-03","c":78,"t":"姽婳词·其三","a":"","x":"恒王好武兼好色， 遂教美女习骑射。 秾歌艳舞不成欢，列阵挽戈为自得。 眼前不见尘沙起，将军俏影红灯里。 叱吒时闻口舌香，霜矛雪剑娇难举。 丁香结子芙蓉绦， 不系明珠系宝刀。 战罢夜阑心力怯，脂痕粉渍污鲛鮹。 明年流寇走山东，强吞虎豹势如蜂。 王率天兵思剿灭，一战再战不成功。 腥风吹折陇头麦，日照旌旗虎帐空。 青山寂寂水澌澌，正是恒王战死时。 雨淋白骨血染草，月冷黄沙鬼守尸。 纷纷将士只保身，青州眼见皆灰尘， 不期忠义明闺阁，愤起恒王得意人。 恒王得意数谁行，就死将军林四娘， 号令秦姬驱赵女，艳李秾桃临战场。 绣鞍有泪春愁重，铁甲无声夜气凉。 胜负自然难预定，誓盟生死报前王。 贼势猖獗不可敌，柳折花残实可伤， 魂依城郭家乡近，马践胭脂骨髓香。 星驰时报入京师，谁家儿女不伤悲！ 天子惊慌恨失守，此时文武皆垂首。 何事文武立朝纲，不及闺中林四娘！ 我为四娘长太息，歌成馀意尚旁徨。"},{"id":"Z078-14","c":78,"t":"芙蓉女儿诔","a":"","x":"维太平不易之元，蓉桂竞芳之月，无可奈何之日，怡红院浊玉，谨以群花之蕊，冰鲛之縠，沁芳之泉，枫露之茗：四者虽微，聊以达诚申信，乃致祭于白帝宫中抚司秋艳芙蓉女儿之前曰： 窃思女儿自临浊世，迄今凡十有六载。其先之乡籍姓氏，湮沦而莫能考者久矣。而玉得于衾枕栉沐之间，栖息宴游之夕，亲昵狎亵，相与共处者，仅五年八月有奇。忆女儿曩生之昔，其为质则金玉不足喻其贵，其为性则冰雪不足喻其洁，其为神则星日不足喻其精，其为貌则花月不足喻其色。姊妹悉慕媖娴，妪媪咸仰惠德。孰料鸠鸩恶其高，鹰鸷翻遭罦罬；薋葹妒其臭，茝兰竟被芟鉏！花原自怯，岂奈狂飙；柳本多愁，何禁骤雨。偶遭蛊虿之谗，遂抱膏肓之疚。故尔樱唇红褪，韵吐呻吟；杏脸香枯，色陈顑颔。诼谣謑诟，出自屏帏；荆棘蓬榛，蔓延户牖。岂招尤则替，实攘诟而终。既忳幽沉于不尽，复含罔屈于无穷。高标见嫉，闺帏恨比长沙；直烈遭危，巾帼惨于羽野。自蓄辛酸，谁怜夭折！仙云既散，芳趾难寻。洲迷聚窟，何来却死之香？海失灵槎，不获回生之药。眉黛烟青，昨犹我画；指环玉冷，今倩谁温？鼎炉之剩药犹存，襟泪之馀痕尚渍。镜分鸾别，愁开麝月之奁；梳化龙飞，哀折檀云之齿。委金钿于草莽，拾翠㔩于尘埃。楼空鳷鹊，徒悬七夕之针；带断鸳鸯，谁续五丝之缕？况乃金天属节，白帝司时，孤衾有梦，空室无人。桐阶月暗，芳魂与倩影同销；蓉帐香残，娇喘共细言皆绝。连天衰草，岂独蒹葭；匝地悲声，无非蟋蟀。露苔晚砌，穿帘不度寒砧；雨荔秋垣，隔院希闻怨笛。芳名未泯，檐前鹦鹉犹呼；艳质将亡，槛外海棠预老。捉迷屏后，莲瓣无声；斗草庭前，兰芽枉待。抛残绣线，银笺彩缕谁裁？折断冰丝，金斗御香未熨。昨承严命，既趋车而远陟芳园；今犯慈威，复拄杖而近抛孤匶。及闻槥棺被燹，惭违共穴之盟；石椁成灾，愧迨同灰之诮。尔乃西风古寺，淹滞青磷；落日荒丘，零星白骨。楸榆飒飒，蓬艾萧萧。隔雾圹以啼猿，绕烟塍而泣鬼。自为红绡帐里，公子情深；始信黄土垄中，女儿命薄！汝南泪血，斑斑洒向西风；梓泽馀衷，默默诉凭冷月。呜呼！固鬼蜮之为灾，岂神灵而亦妒。箝诐奴之口，讨岂从宽；剖悍妇之心，忿犹未释！在君之尘缘虽浅，然玉之鄙意岂终。因蓄惓惓之思，不禁谆谆之问。始知上帝垂旌，花宫待诏，生侪兰蕙，死辖芙蓉。听小婢之言，似涉无稽；以浊玉之思，则深为有据。何也？昔叶法善摄魂以撰碑，李长吉被诏而为记，事虽殊，其理则一也。故相物以配才，苟非其人，恶乃滥乎？始信上帝委托权衡，可谓至洽至协，庶不负其所秉赋也。因希其不昧之灵，或陟降于兹；特不揣鄙俗之词，有污慧听。乃歌而招之曰： 天何如是之苍苍兮，乘玉虬以游乎穹窿耶？ 地何如是之茫茫兮，驾瑶象以降乎泉壤耶？ 望伞盖之陆离兮，抑箕尾之光耶？ 列羽葆而为前导兮，卫危虚于旁耶？ 驱丰隆以为比从兮，望舒月以离耶？ 听车轨而伊轧兮，御鸾鷖以征耶？ 闻馥郁而薆然兮，纫蘅杜以为纕耶？ 炫裙裾之烁烁兮，镂明月以为珰耶？ 籍葳蕤而成坛畤兮，檠莲焰以烛兰膏耶？ 文瓟匏以为觯斝兮，漉醽醁以浮桂醑耶？ 瞻云气而凝盼兮，仿佛有所觇耶？ 俯窈窕而属耳兮，恍惚有所闻耶？ 期汗漫而无夭阏兮，忍捐弃余于尘埃耶？ 倩风廉之为余驱车兮，冀联辔而携归耶？ 余中心为之慨然兮，徒噭噭而何为耶？ 君偃然而长寝兮，岂天运之变于斯耶？ 既窀穸且安稳兮，反其真而复奚化耶？ 余犹桎梏而悬附兮，灵格余以嗟来耶？ 来兮止兮，君其来耶！ 若夫鸿蒙而居，寂静以处，虽临于兹，余亦莫睹。搴烟萝而为步幛，列枪蒲而森行伍。警柳眼之贪眠，释莲心之味苦。素女约于桂岩，宓妃迎于兰渚。弄玉吹笙，寒簧击敔。征嵩岳之妃，启骊山之姥。龟呈洛浦之灵，兽作咸池之舞。潜赤水兮龙吟，集珠林兮凤翥。爰格爰诚，匪簠匪筥。发轫乎霞城，返旌乎玄圃。既显微而若通，复氤氲而倏阻。离合兮烟云，空蒙兮雾雨。尘霾敛兮星高，溪山丽兮月午。何心意之忡忡，若寤寐之栩栩。余乃欷歔怅望，泣涕旁徨。人语兮寂历，天籁兮筼筜。鸟惊散而飞，鱼唼喋以响。志哀兮是祷，成礼兮期祥。 呜呼哀哉！尚飨！"},{"id":"Z079-01","c":79,"t":"紫菱洲歌","a":"","x":"池塘一夜秋风冷，吹散芰荷红玉影。 蓼花菱叶不胜愁，重露繁霜压纤梗。 不闻永昼敲棋声，燕泥点点污棋枰。 古人惜别怜朋友，况我今当手足情！"}]</script>
