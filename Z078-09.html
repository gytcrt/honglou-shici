<h1>姽婳词·其三·7/11</h1>

<p class="ctx"><i>前文</i>“多话！不好了再作，便作十篇百篇，还怕辛苦了不成！”宝玉听说，只得想了一会，便念道：</p>

<div class="lines"><div class="vl"><p>战罢夜阑心力<span class="nb">怯<button type="button" class="nm" data-k="n0-0" aria-label="注释⑥">⑥</button><span class="jz nz"><span class="one" data-k="n0-0">战罢：习战结束。夜阑：夜深。</span></span>，</span>痕粉渍污<span class="nb">鲛<button type="button" class="nm" data-k="n0-1" aria-label="注释⑦">⑦</button><span class="jz nz"><span class="one" data-k="n0-1">鲛绡：手帕（参见第三十四回《题帕三绝句》注②）。
</span></span></span>。</p></div></div>
<p class="ctx after"><i>后文</i>贾政道：“又一段。底下怎样？”</p>
