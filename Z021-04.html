<h1>淑女从来多抱怨</h1>

<p class="ctx"><i>前文</i>“我有话和你商量。”不知商量何事，且听下回分解。正是：</p>
<details class="zhi"><summary>诗前脂批 3 条</summary><span class="one"><i class="chip">庚辰</i><i class="chip pos">侧批</i>惧内形景写尽了。</span><span class="one"><i class="chip">蒙府</i><i class="chip pos">侧批</i>世俗之态熏人。</span><span class="one"><i class="chip">庚辰</i><i class="chip pos">夹批</i>收(后)［得］淡雅之至！</span></details>
<div class="lines"><div class="vl"><p>淑<span class="nb">女<button type="button" class="nm" data-k="n0-1" aria-label="注释①">①</button><span class="jz nz"><span class="one" data-k="n0-1">淑女：指平儿。</span></span></span>来多抱怨，娇妻自古便含<span class="nb">酸<button type="button" class="nm" data-k="n0-0" aria-label="注释②">②</button><span class="jz nz"><span class="one" data-k="n0-0">娇妻：指凤姐。</span></span><button type="button" class="zm" data-k="z0-0-15" aria-label="脂批">脂</button><span class="jz"><span class="one" data-k="z0-0-15"><i class="chip">庚辰</i><i class="chip pos">夹批</i>二语包尽古今万万世裙钗。</span></span>。</span></p></div></div>

<details class="zhi"><summary>诗后脂批 1 条</summary><span class="one"><i class="chip">戚序</i>总评：不惜恩爱为良人，方是温存一脉真。俗子妒妇浑可笑，语言偏自涉风尘。</span></details><p class="src">注释：蔡义江《红楼梦诗词曲赋全解》（复旦大学出版社），第87页</p><div class="pn"><a href="Z021-03.html">‹ 上一首　题宝玉续庄子文后</a><a href="Z022-01.html">下一首　《山门》中《寄生草》曲 ›</a></div>
