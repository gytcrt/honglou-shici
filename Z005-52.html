<h1>一场幽梦同谁近</h1>

<p class="ctx"><i>前文</i>“可卿救我”，因纳闷道：“我的小名这里没人知道，他如何从梦里叫出来？”正是：</p>
<details class="zhi"><summary>诗前脂批 3 条</summary><span class="one"><i class="chip">戚序</i><i class="chip pos">夹批</i>接得无痕迹。历来小说中之梦未见此一醒。</span><span class="one"><i class="chip">戚序</i><i class="chip pos">夹批</i>细，又是照应前文。</span><span class="one"><i class="chip">戚序</i><i class="chip pos">夹批</i>奇奇怪怪之文，令人摸透不着。　云龙作雨，不知何为龙，何为云，何为雨。</span></details>
<div class="lines"><div class="vl"><p>一场幽梦同谁近，千古情人独我痴。</p></div></div>

<details class="zhi"><summary>诗后脂批 1 条</summary><span class="one"><i class="chip">戚序</i>总评：将一部全盘点出几个，以陪衬宝玉。使宝玉从此倍偏倍痴，倍聪明倍潇洒，亦非突如其来。作者真妙心妙口，妙笔妙人。</span></details><div class="pn"><a href="Z005-51.html">‹ 上一首　红楼梦曲·收尾·飞鸟各投林</a><a href="Z006-01.html">下一首　朝叩富儿门 ›</a></div>
