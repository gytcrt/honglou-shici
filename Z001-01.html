<h1>附编·浮生着甚苦奔忙</h1>

<p class="ctx"><i>前文</i>開卷即云「風塵懷閨秀」，則知作者本意原爲記述當日閨友閨情，並非怨世駡時之書矣。雖一時有涉于世態，然亦不得不叙者，但非其本旨耳，閱者切記之。詩曰：</p>

<div class="lines"><div class="vl"><p>浮生著甚苦奔忙？盛席华筵终散场。</p></div><div class="vl"><p>悲喜千般同幻渺，古今一梦尽荒唐。</p></div><div class="vl"><p>谩言红袖啼痕重，更有情痴抱恨长。</p></div><div class="vl"><p>字字看来皆是血，十年辛苦不寻常！</p></div></div>
